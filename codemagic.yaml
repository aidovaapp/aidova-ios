workflows:
  ios-workflow:
    name: Aidova iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Aidova App Store Connect
    working_directory: "Aidova AAC- IOS/src"
    environment:
      vars:
        BUNDLE_ID: "app.aidova.aac"
        XCODE_WORKSPACE: "Aidova AAC.xcworkspace"
        XCODE_SCHEME: "Aidova AAC"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: List existing certificates
        script: |
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --p12-password "" \
            -v
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: false
